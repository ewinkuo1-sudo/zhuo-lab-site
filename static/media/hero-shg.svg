<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" role="img" aria-label="Stylised second-harmonic generation image of collagen fibres">
  <defs>
    <radialGradient id="fov" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0f5f52" stop-opacity="0.9"/>
      <stop offset="0.65" stop-color="#062e28" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#03181a" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="fib" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#6ee7b7" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#a7f3d0" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#34d399" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <clipPath id="circle"><circle cx="320" cy="260" r="228"/></clipPath>
  </defs>

  <!-- field of view -->
  <circle cx="320" cy="260" r="232" fill="url(#fov)"/>
  <circle cx="320" cy="260" r="228" fill="url(#grid)"/>

  <!-- collagen fibre bundles, clipped to the field of view -->
  <g clip-path="url(#circle)" fill="none" stroke-linecap="round">
    <g stroke="#34d399" stroke-opacity="0.35" stroke-width="18" filter="url(#softglow)">
      <path d="M60 420 C 180 300, 260 320, 380 200 S 560 60, 620 40"/>
      <path d="M40 300 C 160 260, 240 180, 340 150 S 520 120, 640 160"/>
    </g>
    <g stroke="url(#fib)" stroke-width="3.5" filter="url(#glow)">
      <path d="M60 420 C 180 300, 260 320, 380 200 S 560 60, 620 40"/>
      <path d="M80 440 C 200 330, 280 340, 400 220 S 570 90, 640 70"/>
      <path d="M100 470 C 220 360, 300 360, 420 250 S 590 120, 660 100"/>
      <path d="M40 300 C 160 260, 240 180, 340 150 S 520 120, 640 160"/>
      <path d="M30 330 C 150 290, 230 210, 330 180 S 510 150, 630 190"/>
      <path d="M50 360 C 170 320, 250 240, 350 210 S 530 180, 650 220"/>
      <path d="M120 120 C 200 200, 260 260, 300 340 S 340 460, 330 520"/>
      <path d="M150 100 C 230 180, 290 240, 330 320 S 370 440, 360 500"/>
      <path d="M420 480 C 440 400, 470 330, 520 290 S 600 240, 660 250"/>
    </g>
    <g stroke="#a7f3d0" stroke-opacity="0.55" stroke-width="1.2">
      <path d="M70 430 C 190 310, 270 330, 390 210 S 570 70, 630 50"/>
      <path d="M35 315 C 155 275, 235 195, 335 165 S 515 135, 635 175"/>
      <path d="M135 110 C 215 190, 275 250, 315 330 S 355 450, 345 510"/>
    </g>
    <!-- SHG speckle -->
    <g fill="#d1fae5" fill-opacity="0.7">
      <circle cx="250" cy="300" r="1.6"/><circle cx="410" cy="190" r="1.3"/><circle cx="470" cy="330" r="1.8"/>
      <circle cx="180" cy="220" r="1.2"/><circle cx="360" cy="400" r="1.5"/><circle cx="300" cy="140" r="1.1"/>
      <circle cx="520" cy="240" r="1.4"/><circle cx="220" cy="390" r="1.3"/><circle cx="440" cy="120" r="1.2"/>
    </g>
  </g>

  <!-- reticle -->
  <g fill="none" stroke="#6ee7b7" stroke-opacity="0.55" stroke-width="1">
    <circle cx="320" cy="260" r="232"/>
    <circle cx="320" cy="260" r="160" stroke-dasharray="2 6" stroke-opacity="0.35"/>
    <path d="M320 20v36M320 464v36M72 260h36M532 260h36"/>
  </g>

  <!-- scale bar + label -->
  <g font-family="Inter, 'Segoe UI', sans-serif" fill="#a7f3d0">
    <rect x="452" y="478" width="96" height="3" fill="#a7f3d0"/>
    <text x="500" y="500" font-size="12" text-anchor="middle" letter-spacing="1">50 µm</text>
    <text x="92" y="500" font-size="11" letter-spacing="2" fill-opacity="0.8">P-SHG · COLLAGEN</text>
    <text x="92" y="48" font-size="11" letter-spacing="2" fill-opacity="0.8">λ = 1030 nm</text>
  </g>
</svg>

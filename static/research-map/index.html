<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>研究地圖｜卓冠宇實驗室</title>
<meta name="description" content="跟著一束光，走過卓冠宇實驗室的四個研究方向：多模態顯微、偏振 SHG、AI 影像分析、內視鏡微型化。">
<!-- 分享預覽圖要絕對網址；掛到官網 static/research-map/ 時是這個位置，網域換了要一起改 -->
<meta property="og:type" content="website">
<meta property="og:title" content="研究地圖｜卓冠宇實驗室">
<meta property="og:description" content="跟著一束光，走過四個研究方向：看得到、讀得懂、判得準、到得了。">
<meta property="og:image" content="https://ewinkuo1-sudo.github.io/zhuo-lab-site/research-map/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* 配色、字型照官網 data/themes/zhuo.toml、data/fonts/zhuo.toml；官網只做淺色，這裡也是。
   光束用真實波長色；780 nm 是近紅外，畫成紅色是示意。 */
:root{
  color-scheme:light;
  --primary:#137c83; --primary-soft:#e3f1f1; --navy:#142d45; --navy-text:#edf3f8; --navy-active:#a3e4e5;
  --bg:#faf8f4; --card:#ffffff; --ink:#1d2a36; --muted:#5b6876; --line:#e3ded4;
  --w780:#d7261e; --wSHG:#6f3fd1; --wTPEF:#1f9e5a; --cable:#137c83;
  --dev:#a8650b; --dev-bg:#fbf0dc;
  --f-body:"Inter","Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  --f-mono:"Roboto Mono",ui-monospace,Consolas,monospace;
  --bar:56px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75}
a{color:var(--primary)}
a:focus-visible,button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

.bar{position:sticky;top:0;z-index:20;height:var(--bar);background:var(--navy);color:var(--navy-text);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 max(16px,calc((100vw - 1320px)/2))}
.bar .brand{display:flex;align-items:baseline;gap:12px;min-width:0;white-space:nowrap;overflow:hidden}
.bar b{color:#fff;font-weight:700;font-size:17px}
.bar span{color:var(--navy-active);font-size:14px}
.bar a{color:var(--navy-text);font-size:14px;text-decoration:none;white-space:nowrap}
.bar a:hover{color:var(--navy-active)}
.bar .nav{display:flex;align-items:center;gap:14px;flex:none}
.bar .nav #langsw{border:1px solid rgba(237,243,248,.45);border-radius:999px;padding:1px 9px;font-size:13px}
@media (max-width:440px){html[lang="en"] #brand-page{display:none}} /* 英文字比較寬，窄螢幕只留實驗室名 */

.hero{max-width:1320px;margin:0 auto;padding:26px 16px 18px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px} /* 收短，讓光學桌在第一屏就露出來 */
.eyebrow{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.14em;color:var(--primary);text-transform:uppercase;margin:0}
.hero h1{font-size:clamp(30px,4.6vw,52px);line-height:1.2;margin:0;letter-spacing:.02em;color:var(--navy);text-wrap:balance}
.hero p.lede{font-size:clamp(16px,1.6vw,19px);color:var(--muted);margin:0;max-width:46em}
.route{display:flex;flex-wrap:wrap;gap:8px 6px;align-items:center;margin-top:10px;padding:0;list-style:none}
.route li{display:flex;align-items:center;gap:6px}
.route li+li::before{content:"";width:22px;height:2px;background:var(--w780);opacity:.55;border-radius:1px}
.route a{display:inline-flex;align-items:baseline;gap:6px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);text-decoration:none;color:var(--ink);font-size:14.5px}
.route a .dot{width:10px;height:10px;border-radius:50%;flex:none;align-self:center;display:inline-block}
.route a b{color:var(--primary);font-weight:600}
.route a:hover{border-color:var(--primary)}
.cue{color:var(--muted);font-size:14px;margin-top:4px}
/* ?shot=probe：只拍 3D 場景（內視鏡站概念圖用） */
.shot .stepper,.shot .plate,.shot #labels{display:none}

.story{max-width:1320px;margin:0 auto;padding:0 16px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:32px;align-items:start}
.stagewrap{position:sticky;top:calc(var(--bar) + 12px);height:calc(100vh - var(--bar) - 24px);min-height:420px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}
#stage3d{position:absolute;inset:0}
#stage3d canvas{display:block}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;white-space:nowrap;font-size:12.5px;font-weight:500;line-height:1.3;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.92);color:var(--navy);border:1px solid var(--line);box-shadow:0 1px 3px rgba(20,45,69,.12);transition:opacity .35s}
.lab.hl{border-color:var(--primary);color:var(--primary)}
.lab.dev{border-style:dashed;border-color:var(--dev);color:var(--dev)}
.lab.off{opacity:0}
#stage2d{position:absolute;inset:0;width:100%;height:100%;display:none}
.stepper{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:4px;flex-wrap:wrap;pointer-events:auto}
.stepper button{font:inherit;font-size:12.5px;border:1px solid var(--line);background:rgba(255,255,255,.9);color:var(--muted);border-radius:999px;padding:2px 10px;cursor:pointer}
.stepper button.on{border-color:var(--primary);color:#fff;background:var(--primary)}
.stepper button.done{color:var(--primary);border-color:var(--primary)}
.plate{position:absolute;left:12px;bottom:10px;right:12px;font-size:12px;color:var(--muted);line-height:1.5;pointer-events:none}
.plate i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin:0 4px 0 10px}
.plate i:first-child{margin-left:0}

.steps{display:flex;flex-direction:column;gap:0;padding-bottom:30vh}
.step{min-height:92vh;display:flex;flex-direction:column;justify-content:center;padding:6vh 0;scroll-margin-top:var(--bar)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 28px;display:flex;flex-direction:column;gap:16px;box-shadow:0 1px 2px rgba(20,45,69,.04);transition:border-color .3s,box-shadow .3s}
.step.active .card{border-color:color-mix(in srgb,var(--primary) 45%,var(--line));box-shadow:0 6px 24px rgba(20,45,69,.08)}
.kicker{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13.5px;color:var(--muted)}
.kicker .n{font-family:var(--f-mono);color:var(--primary);font-weight:500}
.kicker .verb{font-weight:700;color:var(--navy);font-size:15px}
.tag-dev{font-size:12.5px;padding:1px 9px;border-radius:999px;background:var(--dev-bg);color:var(--dev);border:1px dashed var(--dev);font-weight:500}
.card h2{margin:0;font-size:clamp(22px,2.3vw,28px);line-height:1.35;color:var(--navy);text-wrap:balance}
.card h3{margin:0 0 2px;font-size:13px;letter-spacing:.08em;color:var(--primary);font-weight:600}
.card p{margin:0}
.card .q{font-size:18px;font-weight:500;color:var(--ink)}
figure{margin:0;display:flex;flex-direction:column;gap:8px}
figure a.img{display:block;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
figure img{display:block;width:100%;height:auto;max-height:440px;object-fit:contain;background:#fff}
figcaption{font-size:13px;color:var(--muted);line-height:1.6}
.papers{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.papers li{font-size:14.5px;line-height:1.55;padding-left:12px;border-left:3px solid var(--primary-soft)}
.papers .t{display:block;color:var(--ink);font-weight:500}
.papers .m{display:block;color:var(--muted);font-size:13px}
.status{font-size:14px;color:var(--muted);background:var(--bg);border-radius:8px;padding:10px 14px}
.toys{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.toy{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink)}
.toy:hover{border-color:var(--primary)}
.toy b{display:block;font-weight:600;font-size:14.5px;color:var(--primary)}
.toy small{display:block;color:var(--muted);font-size:13px;line-height:1.5}
.end .card{background:var(--navy);color:var(--navy-text);border-color:var(--navy)}
.end .card h2{color:#fff;font-size:clamp(26px,3vw,36px)}
.end .card p{color:var(--navy-text)}
.end .card a{color:var(--navy-active)}
.end .links{display:flex;flex-wrap:wrap;gap:10px 18px}

footer{max-width:1320px;margin:0 auto;padding:24px 16px 40px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}

/* 窄螢幕：不跑 3D，上方固定一條平面光路 */
@media (max-width:860px){
  .hero{padding:36px 16px 24px}
  .story{grid-template-columns:minmax(0,1fr);gap:0}
  .stagewrap{top:var(--bar);height:auto;aspect-ratio:2/1.08;min-height:0;border-radius:0;border-left:0;border-right:0;margin:0 -16px;z-index:5;box-shadow:0 4px 10px rgba(20,45,69,.08)}
  .stepper,.plate{display:none}
  .route li+li::before{display:none}
  .step{min-height:0;padding:20px 0}
  .card{padding:20px 18px}
  .steps{padding-bottom:40px}
}
/* SVG 平面光路（手機或沒有 WebGL 時） */
.flat #stage3d,.flat #labels{display:none}
.flat #stage2d{display:block}
#stage2d .beam{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .9s ease}
#stage2d .beam.on{stroke-dashoffset:0}
#stage2d .part{opacity:.28;transition:opacity .4s}
#stage2d .part.on{opacity:1}
#stage2d .part.hl rect,#stage2d .part.hl circle,#stage2d .part.hl line.el{stroke:var(--primary);stroke-width:2}
#stage2d text{font-family:var(--f-body);font-size:10px;fill:var(--navy)}
#stage2d .dev text{fill:var(--dev)}
@media (prefers-reduced-motion:reduce){#stage2d .beam,#stage2d .part,.lab{transition:none}}
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><b id="brand-lab">卓冠宇實驗室</b><span id="brand-page">研究地圖</span></div>
  <div class="nav"><a id="langsw" href="en/" lang="en">EN</a><a id="official" href="#">回實驗室官網 →</a></div>
</header>

<section class="hero">
  <p class="eyebrow" id="eyebrow">Research map · 跟著一束光走</p>
  <h1 id="statement"></h1>
  <p class="lede" id="desc"></p>
  <ol class="route" id="route"></ol>
  <p class="cue" id="cue">往下捲，光會在示意光路上一站一站往前走；每一站的卡片寫這個方向的問題、方法和已發表成果。</p>
</section>

<main class="story">
  <div class="stagewrap" id="stagewrap">
    <div id="stage3d" role="img" aria-label="示意光路：雷射經半波片、掃描振鏡進物鏡打到樣品，訊號回到兩支偵測器，資料送到工作站；另一支分光經光纖到探頭；終點是寫著實驗室目標的螢幕。完整文字在右側。"></div>
    <div id="labels" aria-hidden="true"></div>
    <svg id="stage2d" viewBox="0 0 400 216" role="img" aria-label="平面示意光路，捲動時依序亮起"></svg>
    <div class="stepper" id="stepper"></div>
    <div class="plate" id="plate"><i style="background:var(--w780)"></i>780 nm 激發（近紅外，示意色）<i style="background:var(--wSHG)"></i>SHG 390 nm<i style="background:var(--wTPEF)"></i>雙光子螢光<i style="background:var(--cable)"></i>資料線<br>示意光路，依物理規則排，不是實驗室的真實架設。</div>
  </div>
  <div class="steps" id="steps"></div>
</main>

<footer id="foot">
  <span>示意光路的規則：光只走直線、在 45° 鏡轉彎、只在樣品處變色。它用來說故事，不是實驗室的真實架設。780 nm 是近紅外光，肉眼看不到，圖中的紅色是示意色。</span>
  <span>文字與論文取自實驗室官網研究頁與已發表論文；論文圖依 CC BY 4.0 授權使用，出處標在圖下。</span>
</footer>

<script src="data.js"></script>
<script src="vendor/three.min.js"></script><!-- three.js r128，自帶不走 CDN -->
<script>
const Q=new URLSearchParams(location.search);
// 語言：en/index.html 在 <html> 上帶 data-lang="en"、data-base="../"（由 build_data.py 產生）；預覽或 Artifact 可用 ?lang=en
const ROOT=document.documentElement,LANG=ROOT.dataset.lang||(Q.get("lang")==="en"?"en":"zh"),EN=LANG==="en",BASE=ROOT.dataset.base||"";
const t=(zh,en)=>EN?en:zh;
const D=window.SITE_DATA[LANG];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// ?still：直接顯示每站完成狀態（截圖用，效果同減少動態）；?shot=probe：只拍探頭那一角
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches||Q.has("still")||Q.has("shot");
const SHOT=Q.get("shot");
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
// 放在官網 /research-map/ 底下時，中文回官網的中文版（上一層的 zh/），英文回官網首頁（en 是預設語言、沒前綴）；
// 其他地方（預覽、Artifact）用 data 裡的絕對網址
const ONSITE=/\/research-map\/?(en\/)?(index\.html)?$/.test(location.pathname);
const OFFICIAL=ONSITE?new URL(EN?BASE+"../":"../zh/",location.href).href:D.official;
// 中／EN 切換：官網與本機預覽走 en/ 子目錄；直接雙擊開檔走 index.html；其他地方（Artifact）用 ?lang=
const FILE=location.protocol==="file:",LOCAL=ONSITE||/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const LANGSW=EN?(BASE?(FILE?"../index.html":"../"):location.pathname):(LOCAL?"en/":FILE?"en/index.html":"?lang=en");

/* ---------- 文字 ---------- */
document.getElementById("statement").textContent=D.statement;
document.getElementById("desc").textContent=D.description;
document.getElementById("official").href=OFFICIAL;
const sw=document.getElementById("langsw");sw.href=LANGSW;
if(EN){sw.textContent="中文";sw.lang="zh-Hant";
  ROOT.lang="en";document.title="Research Map | Zhuo Lab";
  document.querySelector('meta[name="description"]').content="Follow one beam of light through the four research directions of the Zhuo Lab: multimodal microscopy, polarization-resolved SHG, AI image analysis and miniaturized endomicroscopy.";
  const set=(id,h)=>{document.getElementById(id).innerHTML=h};
  set("brand-lab","Zhuo Lab");set("brand-page","Research Map");set("official","Back to lab website →");
  set("eyebrow","Research map · Follow the light");
  set("cue","Scroll down and the light moves along the schematic path, one station at a time. Each card gives the question, method and published results for that direction.");
  set("plate",'<i style="background:var(--w780)"></i>780 nm excitation (near-infrared, display colour)<i style="background:var(--wSHG)"></i>SHG 390 nm<i style="background:var(--wTPEF)"></i>Two-photon fluorescence<i style="background:var(--cable)"></i>Data cable<br>Schematic beam path laid out by physical rules; not the lab’s actual setup.');
  set("foot","<span>Rules of the schematic path: light travels in straight lines, turns only at 45° mirrors and changes colour only at the sample. It tells a story; it is not the lab’s actual setup. 780 nm light is near-infrared and invisible; the red is a display colour.</span><span>Text and papers come from the research page of the lab website and from published papers. Published figures are used under CC BY 4.0, with the source under each figure.</span>");
  document.getElementById("stage3d").setAttribute("aria-label","Schematic beam path: the laser passes a half-wave plate and scanning galvos into the objective and onto the sample; the signal returns to two detectors and the data go to a workstation; a second branch goes through a fibre to a probe; the destination is a screen with the lab’s goal. Full text is on the right.");
  document.getElementById("stage2d").setAttribute("aria-label","Flat schematic beam path that lights up as you scroll");
}
const NAMES=[t("光源","Source"),...D.stations.map(s=>s.verb),t("終點","Destination")];
// 四站的顏色與官網首頁色標、成員島四條光路同一套（官網 data/stations.json）。
const STCOL={microscopy:"#56B4E9",collagen:"#E69F00",ai:"#CC79A7",endomicroscopy:"#009E73"};
document.getElementById("route").innerHTML=D.stations.map((s,i)=>`<li><a href="#st-${i+1}"><i class="dot" style="background:${STCOL[s.key]||"var(--primary)"}"></i><b>${esc(s.verb)}</b>${esc(s.name)}</a></li>`).join("");

const intro=EN?`<article class="step" id="st-0" data-i="0"><div class="card">
  <div class="kicker"><span class="n">Start</span><span class="verb">A near-infrared laser beam</span></div>
  <h2>How can you see tissue without staining it?</h2>
  <p>The lab uses a near-infrared laser with extremely short pulses. Only at the focal point are the photons dense enough for the tissue itself to emit new light: collagen gives off second-harmonic generation (SHG) at exactly half the wavelength, and molecules in cells give off two-photon fluorescence.</p>
  <p>These signals come from the tissue itself, so no stain is needed. Follow this beam to see how it leads, step by step, towards label-free diagnosis.</p>
</div></article>`:`<article class="step" id="st-0" data-i="0"><div class="card">
  <div class="kicker"><span class="n">起點</span><span class="verb">一束近紅外雷射</span></div>
  <h2>不染色，怎麼看見組織？</h2>
  <p>實驗室用的是脈衝極短的近紅外雷射。只有在聚焦的那一點，光子才密集到能讓組織自己發出新的光：膠原蛋白會發出波長剛好減半的倍頻光（SHG），細胞裡的分子會發出雙光子螢光。</p>
  <p>這些訊號來自組織本身，所以不需要先染色。接下來跟著這束光，看它怎麼一步步走向「無標記診斷」。</p>
</div></article>`;

const stepHTML=(s,i)=>{
  const fig=s.figure?`<figure><a class="img" href="${esc(BASE+s.figure.src)}" target="_blank" rel="noopener"><img src="${esc(BASE+s.figure.src)}" width="${s.figure.w}" height="${s.figure.h}" alt="${esc(s.figure.alt)}" loading="lazy" decoding="async"></a>
    <figcaption>${esc(s.figure.caption)}<br>${esc(s.figure.credit)}${s.figure.source?` · <a href="${esc(s.figure.source)}">${t("原文","Article")}</a> · <a href="${esc(s.figure.license)}">CC BY 4.0</a>`:""}</figcaption></figure>`:"";
  const toys=s.toys.length?`<div><h3>${t("動手玩","Try it yourself (pages in Chinese)")}</h3><div class="toys">${s.toys.map(t=>`<a class="toy" href="${esc(t.url)}" target="_blank" rel="noopener"><b>${esc(t.title)} ↗</b><small>${esc(t.desc)}</small></a>`).join("")}</div></div>`:"";
  return `<article class="step" id="st-${i+1}" data-i="${i+1}"><div class="card">
  <div class="kicker"><span class="n">${t(`第 ${i+1} 站`,`Station ${i+1}`)}</span><span class="verb">${esc(s.verb)}</span>${s.developing?`<span class="tag-dev">${t("發展中","In development")}</span>`:""}</div>
  <h2>${esc(s.name)}</h2>
  <div><h3>${t("研究問題","Research question")}</h3><p class="q">${esc(s.question)}</p></div>
  <div><h3>${t("方法","Method")}</h3><p>${esc(s.method)}</p></div>
  <div><h3>${esc(s.finding_label)}</h3><p>${esc(s.finding)}</p></div>
  ${fig}
  <div><h3>${esc(s.papers_label)}</h3><ul class="papers">${s.papers.map(p=>`<li><span class="t">${esc(p.title)}</span><span class="m">${esc(p.authors)} · ${esc(p.journal)} · ${p.year} · <a href="https://doi.org/${esc(p.doi)}">DOI</a></span></li>`).join("")}</ul></div>
  <p class="status">${esc(s.status)}</p>
  ${toys}

const endHTML=`<article class="step end" id="st-${D.stations.length+1}" data-i="${D.stations.length+1}"><div class="card">

  const cy=0.03,cab=(pts,s,after)=>beam(pts.map(([x,z,y])=>new THREE.Vector3(x,y??cy,z)),"--cable",s,{r:0.018,cable:true,after});
  cab([[2.0,-2.4],[2.0,-4.6],[PCX-0.3,-4.6],[PCX-0.3,PCZ,-0.32]],3);
  cab([[0.75,-3.75],[0.75,-4.5],[PCX+0.3,-4.5],[PCX+0.3,PCZ,-0.32]],3);
  const fb0=beam([P.BS,P.G2a],"--w780",4),fb1=beam([P.G2a,P.G2b],"--w780",4,{after:fb0}),fb=beam([P.G2b,P.CPL],"--w780",4,{after:fb1});
  beam(fibCurve.getPoints(110),"--w780",4,{r:0.007,after:fb});
  cab([[PCX+0.6,PCZ,-0.3],[5.55,PCZ+0.4],[5.55,EZ-0.1],[EX+0.3,EZ-0.1]],5);

  /* 標籤（h＝哪一站強調；show＝哪些站看得到） */
  const LABS=[
    {t:t("飛秒雷射 780 nm","Femtosecond laser 780 nm"),at:[-4.65,1.5,ZA],show:[0,5],h:0},
    {t:t("半波片：轉偏振","Half-wave plate: rotates polarization"),at:[-2.9,1.45,ZA],show:[0,2],h:2},
    {t:t("掃描振鏡","Scanning galvos"),at:[-0.85,1.75,ZA],show:[0],h:0},
    {t:t("物鏡與樣品","Objective and sample"),at:[2.8,2.6,ZB],show:[0,1,2,5],h:1},
    {t:t("SHG 偵測","SHG detector"),at:[1.42,1.35,-2.4],show:[1],h:1},
    {t:t("雙光子螢光偵測","Two-photon fluorescence detector"),at:[0.6,1.35,-3.22],show:[1],h:1},
    {t:t("工作站：影像分析","Workstation: image analysis"),at:[PCX,0.85,PCZ],show:[3,5],h:3},
    {t:t("分光鏡","Beamsplitter"),at:[-2.25,1.2,ZA],show:[4],h:4},
    {t:t("振鏡：掃描進光纖","Galvos: scanning into the fibre"),at:[-1.6,1.9,-0.78],show:[4],h:4},
    {t:t("光纖探頭（發展中）","Fibre probe (in development)"),at:[0.3,1.45,1.15],show:[4,5],h:4,dev:true},
    {t:t("終點","Destination"),at:[EX,1.95,EZ],show:[5],h:5}];
  LABS.forEach(L=>{const el=document.createElement("div");el.className="lab off"+(L.dev?" dev":"");el.textContent=L.t;labelsEl.appendChild(el);L.el=el});

  /* 每站鏡頭 */
  // 終點：拉近到看得清螢幕上的字，但仍看得到整張桌
  const CAM=[[[-6.6,3.3,2.4],[-3.2,0.8,-1.5]],[[0.2,5.0,3.6],[1.4,1.0,-2.1]],[[-4.2,2.5,1.0],[-2.8,0.9,-1.5]],[[-0.6,5.5,0.0],[2.6,0.0,-4.0]],[[-2.8,4.2,5.0],[-0.9,0.6,0.0]],[[1.7,5.2,7.2],[1.7,0.3,-1.0]]];
  const SHOTS={probe:{cam:[[-1.3,1.75,2.75],[0.15,0.7,1.0]],act:4}};
  const camPos=new THREE.Vector3(...CAM[0][0]),camTgt=new THREE.Vector3(...CAM[0][1]);
  camera.position.copy(camPos);camera.lookAt(camTgt);const look=camTgt.clone();

  let act=0;
  function apply(a){if(SHOT&&SHOTS[SHOT])a=SHOTS[SHOT].act;act=a;
    rings.forEach(({m,h})=>m.material.opacity=h===a?0.85:0);
    bsG.visible=a>=4;fibG.visible=a>=4;drawPC(a>=3);drawEnd(a>=5);
    LABS.forEach(L=>{L.el.classList.toggle("off",!L.show.includes(a));L.el.classList.toggle("hl",L.h===a)});
    camPos.set(...CAM[a][0]);camTgt.set(...CAM[a][1]);
    if(SHOT&&SHOTS[SHOT]){camPos.set(...SHOTS[SHOT].cam[0]);camTgt.set(...SHOTS[SHOT].cam[1])}
    if(reduce){camera.position.copy(camPos);look.copy(camTgt)}
  }
  if(SHOT&&SHOTS[SHOT])wrap.classList.add("shot");
  listeners.push(apply);

  function resize(){const w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);renderer.domElement.style.width=w+"px";renderer.domElement.style.height=h+"px";camera.aspect=w/h;camera.fov=w/h<0.9?48:38;camera.updateProjectionMatrix()}
  new ResizeObserver(resize).observe(host);resize();

  const clock=new THREE.Clock(),tmp=new THREE.Vector3(),v=new THREE.Vector3();const SPEED=7;
  function pointAt(b,d){for(const s of b.segs){if(d<=s.L0+s.l)return tmp.lerpVectors(s.a,s.b,(d-s.L0)/s.l)}return b.segs[b.segs.length-1].b}
  // 舞台捲出視野或分頁藏起來時不算、不畫，省電
  const self={running:true,inView:true};
  new IntersectionObserver(es=>{self.inView=es[0].isIntersecting},{threshold:0}).observe(wrap);
  function tick(){
    requestAnimationFrame(tick);if(!self.running||!self.inView||document.hidden)return;
    const dt=Math.min(clock.getDelta(),0.05),t=clock.elapsedTime;
    camera.position.lerp(camPos,reduce?1:0.06);look.lerp(camTgt,reduce?1:0.06);camera.lookAt(look);
    beams.forEach(b=>{const want=act>=b.s&&(!b.after||b.after.prog>=1);
      if(reduce)b.prog=want?1:0;else b.prog=want?Math.min(1,b.prog+dt*SPEED/b.L):Math.max(0,b.prog-dt*3);
      const d=b.prog*b.L;
      b.segs.forEach(s=>{const f=Math.max(0,Math.min(1,(d-s.L0)/s.l));const vis=f>0;s.core.visible=s.glow.visible=vis;if(vis)s.core.scale.y=s.glow.scale.y=f*s.l});
      const n=b.photons.length;b.photons.forEach((p,k)=>{p.visible=b.prog>=1;if(!p.visible)return;const u=reduce?(k+.5)/n:((t*0.7/b.L+b.off+k/n)%1);p.position.copy(pointAt(b,u*b.L))})});
    polArrows.forEach(({g,mat},i)=>{mat.opacity=act>=2?1:0;g.rotation.x=act>=2?(reduce?0.7:t*0.9+i*0.6):0});
    const W=host.clientWidth,H=host.clientHeight;
    // 標籤夾在畫布內（左右留半個標籤寬、上下留標籤高）
    LABS.forEach(L=>{v.set(...L.at).project(camera);const bw=L.el.offsetWidth/2+6,bh=L.el.offsetHeight+6;
      const x=Math.max(bw,Math.min(W-bw,(v.x*.5+.5)*W)),y=Math.max(bh,Math.min(H-34,(-v.y*.5+.5)*H));
      L.el.style.transform=`translate(${x}px,${y}px) translate(-50%,-100%)`;L.el.style.visibility=v.z<1?"visible":"hidden"});
    renderer.render(scene,camera);
  }
  apply(0);tick();
  return self;
}

setMode();
// 網址帶 #st-3 時直接跳到那一站（分享連結、截圖用）
const jump=location.hash.match(/^#st-(\d+)$/);
if(jump){document.documentElement.style.scrollBehavior="auto";document.getElementById("st-"+jump[1])?.scrollIntoView({block:"start"})}
onScroll();listeners.forEach(f=>f(active));
</script>
</body>

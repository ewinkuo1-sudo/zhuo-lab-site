############################
## HUGO MODULES
## Docs: https://gohugo.io/hugo-modules/
############################

imports:
  # blox-plugin-decap-cms 拿掉：站上沒有 /admin/ 後台，它只會讓首頁多載 netlify-identity-widget.js（234 KB 第三方腳本）。
  - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-plugin-netlify
  - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-bootstrap/v5

# Content mounts. English publications are mounted into the Chinese site too,
# so /zh/publication/ exists without duplicating files.
mounts:
  - source: content/en
    target: content
    lang: en
  - source: content/zh
    target: content
    lang: zh
  - source: content/en/publication
    target: content/publication
    lang: zh
  - source: content/en/authors
    target: content/authors
    lang: zh
  - source: static
    target: static
  - source: assets
    target: assets
  - source: layouts
    target: layouts
  - source: data
    target: data
  - source: i18n
    target: i18n
  - source: archetypes
    target: archetypes

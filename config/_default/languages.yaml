# Languages. Docs: https://docs.hugoblox.com/reference/language/
# Content directories are mounted in module.yaml (content/en -> en, content/zh -> zh).
en:
  languageCode: en-us
  weight: 1
zh:
  languageCode: zh-Hant-TW
  weight: 2
  title: 卓冠宇實驗室 國立陽明交通大學生醫光電研究所   # TODO(老師確認): 實驗室正式中文名稱
  params:
    # 主題的 <meta description>／og:description 讀 marketing.seo.description，只寫 params.description 會讓中文頁顯示英文。
    # 其他 seo 鍵照抄 params.yaml，避免語言參數只淺層合併時被清空。
    marketing:
      seo:
        site_type: Organization
        local_business_type: ''
        org_name: 'Zhuo Lab, Institute of Biophotonics, National Yang Ming Chiao Tung University'
        description: 轉譯生醫光電：無標記非線性光學顯微、膠原蛋白偏振 SHG 影像、AI 輔助病理影像分析，以及走向臨床診斷的微型化非線性內視顯微術。
        twitter: ''
    footer:
      copyright:
        notice: '© {year} 卓冠宇實驗室 · 國立陽明交通大學生醫光電研究所 · 台北市北投區立農街二段 155 號'
  menu:
    main:
      - name: 研究
        url: '/#research'
        weight: 10
      - name: 研究地圖
        # static/research-map/，單頁捲動敘事＋3D 光路。
        # 不能寫 '/research-map/'：它不對應任何 zh 內容頁，Hugo 會渲染成 /zh/zhuo-lab-site/research-map/（404）。
        # 相對路徑從 /zhuo-lab-site/zh/ 往上一層，瀏覽器解析成 /zhuo-lab-site/research-map/。
        url: '../research-map/'
        weight: 15
      - name: 論文
        url: '/#publications'
        weight: 20
      - name: 成員
        url: '/#people'
        weight: 30
      - name: 影像
        url: '/gallery/'
        weight: 40
      - name: 加入我們
        url: '/#join'
        weight: 50
      - name: 聯絡
        url: '/#contact'
        weight: 60

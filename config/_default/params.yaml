# SITE SETUP. Docs: https://docs.hugoblox.com/

appearance:
  # Light only. The theme enables the day/night auto-switch only when BOTH theme_day and
  # theme_night are set (see blox-bootstrap layouts/_default/baseof.html), so theme_night is
  # left empty on purpose: the custom SCSS is designed for a white ground.
  theme_day: zhuo
  theme_night: ''
  font: zhuo
  font_size: L

marketing:
  seo:
    site_type: Organization
    local_business_type: ''
    org_name: 'Zhuo Lab, Institute of Biophotonics, National Yang Ming Chiao Tung University'
    description: 'Translational biophotonics: label-free nonlinear optical microscopy, polarization-resolved SHG imaging of collagen, and miniaturized nonlinear endomicroscopy for clinical diagnosis.'
    twitter: ''
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    google_tag_manager: ''
    microsoft_clarity: ''
  verification:
    google: ''
    baidu: ''

header:
  navbar:
    enable: true
    align: r
    show_logo: false
    show_language: true
    show_day_night: false
    show_search: true
    highlight_active_link: true

footer:
  copyright:
    notice: '© {year} Guan-Yu Zhuo Lab, Institute of Biophotonics, National Yang Ming Chiao Tung University.'
    license:
      enable: false

locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'
  address_format: en-us

features:
  syntax_highlighter:
    enable: false
  math:
    enable: false
  privacy_pack:
    enable: false
  repository:
    url: ''
    content_dir: content
    branch: main
  avatar:
    gravatar: false
    shape: circle
  comment:
    provider: ''
  search:
    provider: wowchemy
  map:
    provider: ''
    api_key: ''
    zoom: 15

extensions:
  decap_cms:
    branch: main
    local_backend: false
  academicons:
    enable: true

publications:
  date_format: '2006'
  citation_style: apa
